name: JobSearch Docker CI Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Client Dependencies
        working-directory: ./client
        run: npm ci

      - name: Build Client (Verification)
        working-directory: ./client
        run: npm run build

      - name: Install Server Dependencies
        working-directory: ./server
        run: npm ci

      - name: Run Tests (If any)
        working-directory: ./server
        run: npm test --if-present

  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-test
    strategy:
      matrix:
        service: [client, server, worker, redis]
        include:
          - service: client
            context: ./client
            file: ./client/Dockerfile
            image: jobsearch-client
          - service: server
            context: ./server
            file: ./server/Dockerfile
            image: jobsearch-server
          - service: worker
            context: ./server
            file: ./server/Dockerfile.worker
            image: jobsearch-worker
          - service: redis
            base_image: redis:7
            image: jobsearch-redis
            is_infra: true

    steps:
      - name: Checkout Code
        if: ${{ !matrix.is_infra }}
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Custom Docker Image
        if: ${{ !matrix.is_infra }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:latest

      - name: Pull, Tag, and Push Infrastructure Image
        if: ${{ matrix.is_infra }}
        run: |
          docker pull ${{ matrix.base_image }}
          docker tag ${{ matrix.base_image }} ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:latest
